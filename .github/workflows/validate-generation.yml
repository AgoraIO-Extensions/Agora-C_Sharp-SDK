name: Validate RTC generation

on:
  pull_request:
    branches: [release/4.5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/setup
      - name: Regenerate RTC code
        uses: AgoraIO-Extensions/actions/.github/actions/generate@main
        with:
          working-directory: terra
          github-token: ${{ secrets.GH_TOKEN }}
          generate-code: true
          generate-comment: false
          generate-code-command: |
            sh prepare.sh
            sh rtc.sh
      - name: Compile RTC and unit tests
        run: dotnet build Agora-C_Sharp_RTC-SDK_UT/Agora_C_Sharp_SDK_UT.sln --configuration Release
      - name: Preserve generated RTC code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-rtc-code
          path: |
            Agora-C_Sharp-RTC-SDK/Code/**/*.cs
            Agora-C_Sharp_RTC-SDK_UT/ut/**/*.cs
            !**/obj/**
            !**/bin/**
          retention-days: 7
